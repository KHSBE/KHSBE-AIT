spring:
  application:
    name: compass-backend

  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:compass}
    username: ${DB_USERNAME:compass_user}
    password: ${DB_PASSWORD:compass_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

  ai:
    google:
      genai:
        vertex-ai: ${GOOGLE_GENAI_VERTEX_AI:true}
        project-id: ${GOOGLE_PROJECT_ID}
        location: ${GOOGLE_CLOUD_LOCATION:global}
        credentials-uri: ${GOOGLE_CREDENTIALS_URI}
        chat:
          options:
            model: gemini-3.1-flash-lite-preview
            temperature: 0.7
            functions:
              - currentWeatherFunction
    vectorstore:
      pgvector:
        table-name: travel_embeddings
        dimensions: 768

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.ai: DEBUG

weather:
  api-key: ${WEATHER_API_KEY:default}

app:
  ai:
    model:
      general: ${AI_MODEL_GENERAL:gemini-3.1-flash-lite-preview}
      plan: ${AI_MODEL_PLAN:gemini-3.1-pro-preview}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    language-code: ${GOOGLE_PLACES_LANGUAGE:ko}
    verification:
      enabled: ${PLACES_VERIFICATION_ENABLED:true}
      max-places-per-plan: ${PLACES_VERIFICATION_MAX_PLACES:20}
      min-score: ${PLACES_VERIFICATION_MIN_SCORE:45}
      candidates-per-query: ${PLACES_VERIFICATION_CANDIDATES_PER_QUERY:5}
      cache-ttl-hours: ${PLACES_VERIFICATION_CACHE_TTL_HOURS:24}
  quota:
    plan-per-day: ${PLAN_QUOTA_PER_DAY:3}
    chat-per-day: ${CHAT_QUOTA_PER_DAY:${CHAT_QUOTA_PER_SESSION:10}}
  admin:
    emails: ${ADMIN_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
