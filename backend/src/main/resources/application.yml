spring:
  application:
    name: compass-backend


  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:compass}
    username: ${DB_USERNAME:compass_user}
    password: ${DB_PASSWORD:compass_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

  ai:
    google:
      genai:
        vertex-ai: ${GOOGLE_GENAI_VERTEX_AI:true}
        project-id: ${GOOGLE_PROJECT_ID}
        location: ${GOOGLE_CLOUD_LOCATION:global}
        credentials-uri: ${GOOGLE_CREDENTIALS_URI}


jwt:
  secret: ${JWT_SECRET}



app:
  auth:
    secure-cookies: false
  ai:
    model:
      plan: ${AI_MODEL_PLAN:gemini-4-argon}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
  quota:
    plan-per-day: ${PLAN_QUOTA_PER_DAY:3}
  admin:
    emails: ${ADMIN_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
