services:
  postgres:
    image: ankane/pgvector:latest
    container_name: compass-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: compass
      POSTGRES_USER: compass_user
      POSTGRES_PASSWORD: compass_password
    volumes:
      # ★ 핵심: 아예 새로운 이름(compass_db_data)의 방을 파라고 명령합니다!
      - compass_db_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:latest
    container_name: compass-redis
    ports:
      - "6379:6379"
    restart: always

# 새롭게 만든 볼륨 이름 선언
volumes:
  compass_db_data:

networks:
  default:
    name: compass-network